name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 태그는 베이스 Kafka 버전 + 커밋 sha로 고정한다. latest는 올리지 않는다
      - id: tag
        run: |
          kafka=$(sed -n 's/^ARG STRIMZI_BASE=.*-kafka-\(.*\)$/\1/p' Dockerfile)
          echo "value=kafka-${kafka}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.value }}
